<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FX Alert 匯率到價提醒</title>
  <meta name="description" content="兆豐銀行日圓、韓元買外幣現鈔價格追蹤與到價提醒">
  <!-- 只能執行本站的程式；只能連到本站和 Supabase（登入功能開啟時） -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://*.supabase.co http://127.0.0.1:54321; base-uri 'self'; form-action 'self'">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="page-header">
    <div class="title-row">
      <h1>FX Alert 匯率到價提醒</h1>
      <!-- 登入功能開啟時才會出現（account.js） -->
      <div class="account" id="account" hidden></div>
    </div>
    <p class="account-notice" id="account-notice" role="status" aria-live="polite" hidden></p>
    <p class="subtitle">兆豐銀行・買外幣現鈔的價格</p>
    <p class="status idle" id="status" role="status">載入中…</p>
  </header>

  <main>
    <section aria-labelledby="cards-title">
      <h2 id="cards-title" class="visually-hidden">各幣別目前狀況</h2>
      <div class="cards" id="cards"></div>
    </section>

    <section class="panel" aria-labelledby="conv-title">
      <div class="panel-head">
        <h2 id="conv-title">換匯試算</h2>
        <div class="tabs" role="tablist" aria-label="試算幣別" id="conv-tabs"></div>
      </div>
      <label class="amount" for="twd">
        <span>我要換</span>
        <input id="twd" type="text" inputmode="decimal" autocomplete="off" aria-describedby="conv-note">
        <span>台幣</span>
      </label>
      <div aria-live="polite">
        <p class="empty" id="conv-error" hidden></p>
        <div id="conv-result">
          <dl class="conv">
            <div><dt>現在換</dt><dd><b id="conv-now"></b> <span class="sub" id="conv-now-rate"></span></dd></div>
            <div id="conv-target-row"><dt>等到目標價</dt><dd><b id="conv-target"></b> <span class="sub" id="conv-target-rate"></span></dd></div>
          </dl>
          <p class="verdict" id="conv-verdict"></p>
        </div>
      </div>
      <p class="hint" id="conv-note">※ 僅供參考。實際金額依銀行鈔票面額與手續費而定。</p>
    </section>

    <section class="panel" aria-labelledby="chart-title">
      <div class="panel-head">
        <h2 id="chart-title">近 30 天走勢</h2>
        <div class="tabs" role="tablist" aria-label="走勢幣別" id="chart-tabs"></div>
      </div>
      <p class="hint" id="chart-note" hidden></p>
      <p class="change" id="chart-change" hidden></p>
      <div class="chart-box" id="chart-box">
        <canvas id="chart" role="img" aria-label="匯率走勢圖" aria-describedby="chart-summary"></canvas>
      </div>
      <ul class="marks" id="chart-marks"></ul>
      <!-- 文字摘要：給螢幕閱讀器，畫面上不顯示（避免和圖、標記重複） -->
      <p class="visually-hidden" id="chart-summary"></p>
    </section>

    <!-- 登入後才出現：我的提醒、我的通知紀錄（account.js） -->
    <section class="panel" id="my-rules" aria-labelledby="my-rules-title" hidden>
      <h2 id="my-rules-title">我的提醒</h2>
      <div id="my-rules-body"></div>
      <p class="form-status" id="my-rules-status" role="status" aria-live="polite"></p>
    </section>

    <section class="panel" id="my-alerts" aria-labelledby="my-alerts-title" hidden>
      <h2 id="my-alerts-title">我的通知紀錄</h2>
      <table class="alerts" id="my-alerts-table" hidden>
        <thead>
          <tr><th scope="col">時間</th><th scope="col">幣別</th><th scope="col">匯率</th><th scope="col">你的目標</th></tr>
        </thead>
        <tbody id="my-alerts-body"></tbody>
      </table>
      <p class="empty" id="my-alerts-empty" hidden>還沒有任何到價通知。</p>
    </section>

    <!-- 登入功能關閉時（單人版）才出現 -->
    <section class="panel" id="alerts-panel" aria-labelledby="alerts-title" hidden>
      <h2 id="alerts-title">到價通知紀錄</h2>
      <table class="alerts" id="alerts-table" hidden>
        <thead>
          <tr><th scope="col">時間</th><th scope="col">幣別</th><th scope="col">匯率</th><th scope="col">你的目標</th></tr>
        </thead>
        <tbody id="alerts-body"></tbody>
      </table>
      <p class="empty" id="alerts-empty" hidden>還沒有任何到價通知。</p>
    </section>

    <section class="panel edit" id="edit-panel" aria-labelledby="edit-title" hidden>
      <h2 id="edit-title">想改目標價？</h2>
      <a class="button" id="edit-link" href="https://github.com/XYSMR/fx-alert/edit/main/config.yaml"
         target="_blank" rel="noopener">✎ 在 GitHub 修改目標價</a>
      <p class="hint">頁面約 1 分鐘更新，到價判斷會在下一次排程檢查時套用新目標。</p>
    </section>
  </main>

  <footer class="page-footer">
    <p>資料產生於 <span id="generated-at">—</span><span id="preview-note"></span>・<a id="repo-link" href="https://github.com/XYSMR/fx-alert">原始碼</a><span id="privacy-note" hidden>・<a href="privacy.html">隱私說明</a></span></p>
  </footer>

  <script src="vendor/chart.umd.min.js"></script>
  <!-- config.js 由部署產生（python -m fx_alert site-config）。登入功能關閉時裡面只有
       {"authEnabled": false}；supabase-js 不在這裡載入，只有開啟時才由 account.js 動態載入 -->
  <script src="config.js"></script>
  <script src="account.js"></script>
  <script src="app.js"></script>
</body>
</html>
