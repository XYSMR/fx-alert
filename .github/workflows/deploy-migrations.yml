name: deploy-migrations

# 把 supabase/migrations 裡還沒套用的 migration 套用到 staging，再套用到正式專案。
#
#   staging     GitHub Environment「staging」（不需核准），連線字串 STAGING_DB_URL
#   production  GitHub Environment「production」（必要審核者核准才執行），連線字串 PRODUCTION_DB_URL
#
# 什麼時候跑：
#   * 合併到 main（migration 有變動）：先 staging → **staging 成功才會輪到正式專案**，再等你核准。
#     staging 失敗：正式專案的 job 直接略過，不會出現核准按鈕。
#   * 手動執行（Run workflow）：
#       target = staging     只套用到 staging，可以選 PR 的分支（合併前先在 staging 驗證）
#       target = production  只能在 main 跑；一樣先跑 staging，成功後才輪到正式專案
#
# staging 和正式專案的差別（src/fx_alert/migrations_deploy.py）：
#   * 基準清單：supabase/migrations_baseline_staging.txt（staging 以前手動套用、沒有紀錄的版本）
#   * staging 有 main 沒有的版本（還沒合併的 PR 先套用了）→ 只警告，不擋；正式專案一律停止
#   * staging 紀錄裡的 SQL 和 repo 不同（PR 套用到 staging 後又改過）→ 停止，正式專案也不會跑
#   清理方式見 README〈staging 多出來的 migration〉。
#
# 流程（任何一步失敗就停止）：
#   1. plan      比對資料庫紀錄：哪些要補紀錄（以前手動套用過）、哪些要套用（只讀）
#   2. precheck  要補紀錄的版本：supabase/baseline_checks/<版本>_*.sql 的物件都要存在（只讀）
#                待套用的版本：supabase/prechecks/<版本>_*.sql 必須回傳 0 列（只讀）
#   3. apply     唯一會寫入的一步：再確認計畫沒變、再跑一次檢查 → 補紀錄 → 依序套用
#                （每個 migration 一個交易，失敗就整個 rollback）
#   4. verify    確認 repo 裡的 migration 都已套用（只讀）
#
# 寫入用 Python（psycopg），不用 Supabase CLI：supabase@3.0.0 的 --remote 無法解析
# Session pooler 的連線字串（第一次執行時 "failed to parse connection string"）。
# 紀錄格式和 CLI 相同（supabase_migrations.schema_migrations）。
#
# 連線字串只在需要的 step 透過 env 傳入，不放在 job 層級（安裝套件等步驟拿不到），也不印出來。

# 只有 migration 或事前檢查有變動才觸發；改前端、文件、其他程式都不會。也可以手動執行。
on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/prechecks/**"
  workflow_dispatch:
    inputs:
      target:
        description: "套用到哪裡（production 一樣會先跑 staging）"
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

concurrency:
  group: deploy-migrations
  cancel-in-progress: false

jobs:
  staging:
    name: 套用 migration 到 staging
    # 手動選 production 時只能在 main 跑（staging 也用 main 的內容）；選 staging 可以是任何分支
    if: github.event_name == 'push' || inputs.target == 'staging' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[db]"

      - name: 1. 比對 migration 紀錄（只讀）
        id: plan
        env:
          FX_DEPLOY_TARGET: staging
          DB_URL: ${{ secrets.STAGING_DB_URL }}
        run: python -m fx_alert.migrations_deploy plan

      - name: 2. 事前檢查（只讀；物件不存在或資料不符合就停止，什麼都不寫）
        if: steps.plan.outputs.repair != '' || steps.plan.outputs.pending != ''
        env:
          FX_DEPLOY_TARGET: staging
          DB_URL: ${{ secrets.STAGING_DB_URL }}
        run: python -m fx_alert.migrations_deploy precheck

      - name: 3. 補紀錄＋套用（唯一會寫入的一步）
        if: steps.plan.outputs.repair != '' || steps.plan.outputs.pending != ''
        env:
          FX_DEPLOY_TARGET: staging
          DB_URL: ${{ secrets.STAGING_DB_URL }}
          # 第 1 步的計畫：資料庫的紀錄如果在這之間變了，就不寫入
          EXPECT_REPAIR: ${{ steps.plan.outputs.repair }}
          EXPECT_PENDING: ${{ steps.plan.outputs.pending }}
        run: python -m fx_alert.migrations_deploy apply

      - name: 4. 確認（只讀）
        env:
          FX_DEPLOY_TARGET: staging
          DB_URL: ${{ secrets.STAGING_DB_URL }}
        run: python -m fx_alert.migrations_deploy verify

  production:
    name: 套用 migration 到正式專案
    # needs：staging 成功才會執行；staging 失敗或被略過，這個 job 也略過（不會出現核准按鈕）
    needs: staging
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || inputs.target == 'production')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[db]"

      - name: 1. 比對 migration 紀錄（只讀）
        id: plan
        env:
          FX_DEPLOY_TARGET: production
          DB_URL: ${{ secrets.PRODUCTION_DB_URL }}
        run: python -m fx_alert.migrations_deploy plan

      - name: 2. 事前檢查（只讀；物件不存在或資料不符合就停止，什麼都不寫）
        if: steps.plan.outputs.repair != '' || steps.plan.outputs.pending != ''
        env:
          FX_DEPLOY_TARGET: production
          DB_URL: ${{ secrets.PRODUCTION_DB_URL }}
        run: python -m fx_alert.migrations_deploy precheck

      - name: 3. 補紀錄＋套用（唯一會寫入的一步）
        if: steps.plan.outputs.repair != '' || steps.plan.outputs.pending != ''
        env:
          FX_DEPLOY_TARGET: production
          DB_URL: ${{ secrets.PRODUCTION_DB_URL }}
          # 第 1 步的計畫：資料庫的紀錄如果在這之間變了，就不寫入
          EXPECT_REPAIR: ${{ steps.plan.outputs.repair }}
          EXPECT_PENDING: ${{ steps.plan.outputs.pending }}
        run: python -m fx_alert.migrations_deploy apply

      - name: 4. 確認（只讀）
        env:
          FX_DEPLOY_TARGET: production
          DB_URL: ${{ secrets.PRODUCTION_DB_URL }}
        run: python -m fx_alert.migrations_deploy verify
