# 產生 data.json 並部署到 GitHub Pages。
# 觸發方式：
#   1. check-rates 檢查完後直接呼叫（workflow_call）
#   2. 改了前端、config.yaml 或程式，push 到 main
#   3. 手動 Run workflow
# 部署前一定先驗證 config.yaml，失敗就不部署。
name: deploy-pages

on:
  workflow_call:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "config.yaml"
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12 # 部署最多重試 3 次（每次最多 2 分鐘，中間等 30 秒、90 秒）
    # 不論從哪裡觸發，同一時間只部署一次；正在跑的會跑完，排隊中較舊的會被較新的取代
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy3.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main # 被 check-rates 呼叫時也一律用 main 上最新的前端與設定

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install .

      - name: Validate config.yaml
        run: python -m fx_alert validate-config

      - name: Get data from state branch
        run: |
          if git ls-remote --exit-code --heads origin state >/dev/null; then
            git fetch --depth=1 origin state:refs/remotes/origin/state
            git worktree add data origin/state
          else
            echo "還沒有 state 分支：頁面會顯示「尚無資料」"
            mkdir -p data
          fi

      # 登入功能開啟（多人版）時只輸出公開行情：目標價、狀態、通知紀錄都只在 Supabase
      - name: Build data.json
        env:
          AUTH_ENABLED: ${{ vars.AUTH_ENABLED }}
        run: |
          if [ "${AUTH_ENABLED,,}" = "true" ]; then
            python -m fx_alert build-site --out site/data.json --public
          else
            python -m fx_alert build-site --out site/data.json
          fi

      # 只放頁面需要的檔案（不含 tests/、samples/）
      - name: Assemble site
        run: |
          mkdir _site
          cp -r site/index.html site/style.css site/app.js site/flags.js site/trips.js site/account.js site/vendor \
            site/data.json site/history site/unsubscribe.html site/unsubscribe.js site/privacy.html \
            site/pwa.js site/sw.js site/manifest.webmanifest site/icons _site/
          find _site -type f | sort

      # 登入功能開關（GitHub → Settings → Variables，不是 Secrets：這些值本來就公開）
      #   AUTH_ENABLED 不是 true → config.js 只有 {"authEnabled": false}，不含任何 Supabase 設定
      - name: Generate config.js
        env:
          AUTH_ENABLED: ${{ vars.AUTH_ENABLED }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          python -m fx_alert site-config --out _site/config.js
          if [ "${AUTH_ENABLED,,}" != "true" ] && grep -qi supabase _site/config.js; then
            echo "::error::登入功能關閉，但 config.js 含有 Supabase 設定"
            exit 1
          fi

      # 最後一道防線：公開的檔案裡不能出現 email、SMTP 字樣或 Supabase secret key
      # （vendor 例外：supabase-js 本身含有 "sb_secret_" 字樣，用來警告不要在瀏覽器用 secret key）
      - name: Check for leaked secrets
        run: |
          if grep -rIlE '@[A-Za-z0-9.-]+\.[A-Za-z]{2,}|SMTP_|sb_secret_' _site --exclude-dir=vendor; then
            echo "::error::上面這些檔案疑似包含 email、SMTP 設定或 secret key，停止部署"
            exit 1
          fi
          echo "沒有發現 email、SMTP 字樣或 secret key"

      # 多人版：公開的 data.json 不能有任何人的目標價、狀態或通知紀錄
      - name: Check data.json is public-only
        env:
          AUTH_ENABLED: ${{ vars.AUTH_ENABLED }}
        run: |
          if [ "${AUTH_ENABLED,,}" != "true" ]; then
            echo "登入功能關閉（單人版）：data.json 照舊包含 config.yaml 的目標價"
            exit 0
          fi
          python - <<'PY'
          import json, sys
          from pathlib import Path
          from fx_alert.build_site import history_problems, public_problems
          problems = public_problems(json.load(open("_site/data.json", encoding="utf-8")))
          for path in sorted(Path("_site/history").glob("*.json")):
              problems += history_problems(json.loads(path.read_text(encoding="utf-8")))
          if problems:
              print("::error::公開的 data.json／history 含有個人設定：" + ", ".join(problems))
              sys.exit(1)
          print("data.json 和 history/ 只有公開行情")
          PY

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      # GitHub 偶爾在上傳完之後讀不到剛上傳的檔案（"Fetching artifact metadata failed …
      # Please re-run the deployment at a later time" → "No artifacts named github-pages"），
      # 2026-11-16 12:35、11-19 06:35、09:35 都是這樣。檔案其實已經上傳好了，等一下再部署通常就會成功，
      # 所以最多試 3 次：第 1、2 次失敗不讓整個 job 失敗，第 3 次還失敗才算失敗。
      # 每次最多等 2 分鐘（預設 10 分鐘），整個 job 不會超過 timeout-minutes。
      - name: Deploy to GitHub Pages
        id: deploy1
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          timeout: 120000

      - name: 等 30 秒再重試
        if: steps.deploy1.outcome == 'failure'
        run: echo "第 1 次部署失敗（GitHub 暫時讀不到剛上傳的檔案），30 秒後重試" && sleep 30

      - name: Deploy to GitHub Pages（第 2 次）
        id: deploy2
        if: steps.deploy1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          timeout: 120000

      - name: 等 90 秒再重試
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: echo "第 2 次部署也失敗，90 秒後最後一次重試" && sleep 90

      - name: Deploy to GitHub Pages（第 3 次）
        id: deploy3
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v5
        with:
          timeout: 120000
