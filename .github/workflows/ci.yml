# CI：每次 push 到 main 或開 PR，都驗證 config.yaml、跑 lint 和測試（Python + 前端 + 資料庫 RLS）。
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate-config:
    name: validate-config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install .
      - name: Validate config.yaml
        run: python -m fx_alert validate-config

      # 會被公開的檔案（前端、範例資料、設定檔）不能出現 email 或 SMTP 設定
      - name: Check public files for secrets
        run: |
          if grep -rIlE '@[A-Za-z0-9.-]+\.[A-Za-z]{2,}|SMTP_' site config.yaml --exclude-dir=vendor; then
            echo "::error::上面這些檔案疑似包含 email 或 SMTP 設定"
            exit 1
          fi
          echo "沒有發現 email 或 SMTP 字樣"

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Test
        run: python -m pytest -v

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Frontend unit tests
        # 只用 Node 內建的測試工具，不需要 npm install
        run: node --test site/tests/*.test.js

  db:
    name: db (schema + RLS)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # 本機 Supabase 的預設連線字串（只存在這台 CI 機器上，不是秘密）
      SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      # tests/db 沒跑到就直接失敗，不會默默略過
      FX_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: python -m pip install -e ".[dev,db]"

      - name: Start local Supabase (Postgres only)
        run: npx --yes supabase@3.0.0 db start

      - name: Apply migrations
        run: |
          # db start 通常已經套用 supabase/migrations；沒有的話自己套一次
          if psql "$SUPABASE_DB_URL" -tAc "select to_regclass('public.alert_rules')" | grep -q alert_rules; then
            echo "migrations 已套用"
          else
            for f in supabase/migrations/*.sql; do
              echo "套用 $f"
              psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -q -f "$f"
            done
          fi

      - name: Test schema and RLS
        run: python -m pytest tests/db -v

      - name: Stop
        if: always()
        run: npx --yes supabase@3.0.0 stop --no-backup
