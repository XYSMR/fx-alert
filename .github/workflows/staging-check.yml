# 手動執行：用 staging 的 Supabase 跑一次多人版檢查（只讀）。
#   --mode multi --dry-run：讀規則、抓匯率、判斷，但不寄信、不寫入任何狀態、也不 commit。
# 用來確認 SupabaseStore 對真正的 Supabase REST API 能正常運作。
name: staging-check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install .

      - name: Check secrets are set
        env:
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.STAGING_SUPABASE_SECRET_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SECRET_KEY" ]; then
            echo "::error::請先在 GitHub Secrets 加上 STAGING_SUPABASE_URL 和 STAGING_SUPABASE_SECRET_KEY"
            exit 1
          fi

      - name: Multi-user check (dry-run, read-only)
        env:
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.STAGING_SUPABASE_SECRET_KEY }}
        run: python -m fx_alert check --mode multi --dry-run --force

      # log 是公開的：再確認一次沒有任何 email 出現在這次產生的資料裡
      - name: Check output files for emails
        run: |
          if [ -d data ] && grep -rIlE '@[A-Za-z0-9.-]+\.[A-Za-z]{2,}' data; then
            echo "::error::產生的資料疑似包含 email"
            exit 1
          fi
          echo "沒有發現 email"
