# Supabase 免費方案：資料庫一週沒有任何請求就會暫停。
# 平日的 check-rates 本來就會讀資料庫；這個每週日跑一次，涵蓋排程停用（例如切換、退回期間）的情況。
# 只用公開的 publishable key 讀公開的幣別清單（currencies 表 anon 可讀），不需要任何 secret。
name: keepalive

on:
  schedule:
    - cron: "23 4 * * 0" # 台灣時間週日 12:23
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Read public currency list
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::請先在 GitHub → Settings → Variables 設定 SUPABASE_URL 和 SUPABASE_PUBLISHABLE_KEY"
            exit 1
          fi
          case "$SUPABASE_PUBLISHABLE_KEY" in
            sb_publishable_*) ;;
            *) echo "::error::SUPABASE_PUBLISHABLE_KEY 必須是 sb_publishable_ 開頭"; exit 1 ;;
          esac
          code=$(curl -sS -o /tmp/body -w '%{http_code}' --max-time 20 \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            "$SUPABASE_URL/rest/v1/currencies?select=code&limit=1")
          echo "HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::Supabase 回應 $code（專案可能已暫停，請到 Supabase 後台恢復）"
            exit 1
          fi
