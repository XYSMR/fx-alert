# 定時檢查匯率，到價就寄信（多人版）：
#   * 規則、狀態、通知紀錄在 Supabase（每個人自己的目標價，寄到自己的信箱）
#   * 最後一次檢查的結果寫到 Supabase 的 check_status（每次都寫；網頁狀態列和 gate 讀它）
#   * 公開的匯率走勢存在 state 分支（每天一檔）；只有資料有變時才 commit、更新 GitHub Pages
# 退回單人版：Revert 切換的 PR（chore/cutover），見 docs/multi-user.md 的退回方案。
name: check-rates

on:
  schedule:
    # 備援：每天 24 小時，每 30 分鐘（:07、:37；cron 是 UTC，但分鐘數和台灣一樣）。
    # 主要觸發是 Supabase pg_cron（:05、:35）；gate 會略過 20 分鐘內已經檢查過的那一次。
    # 避開整點（GitHub 整點最塞）。
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "略過檢查時段限制（--force）"
        type: boolean
        default: true
      dry_run:
        description: "不寄信、不寫入 Supabase，只印出來（--dry-run），也不 commit"
        type: boolean
        default: false
      source:
        description: "觸發來源：手動執行請保持 manual（pg_cron 是 Supabase 自動觸發用的）"
        type: choice
        options: [manual, pg_cron]
        default: manual

# 同一時間只能有一個在跑，避免兩次執行同時改 state 分支
concurrency:
  group: check-rates
  cancel-in-progress: false

permissions:
  contents: write # 需要 push 到 state 分支

jobs:
  # 去重：自動觸發有兩個來源（Supabase pg_cron 每 :05/:35 為主、GitHub schedule 每 :07/:37 備援）。
  # 20 分鐘內已經成功檢查過就 run=false：check、deploy 都會被略過（不檢查、不 ping 監控、不部署），
  # workflow 仍然是綠燈。手動執行一律檢查。判斷失敗時照常檢查（check 的條件是 run != 'false'）。
  # 上次檢查的結果先讀 Supabase 的 check_status（publishable key，和網頁一樣是公開資訊），
  # 讀不到才用 state 分支的 last_check.json（它現在只在資料有變時更新，可能比較舊 → 照常檢查）。
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      # 排查用：記下這次是誰觸發的、預定的 cron、實際開始時間（GitHub 排程可能延遲或被丟掉）
      - name: Show trigger
        env:
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
          SOURCE: ${{ inputs.source }}
        run: |
          echo "觸發方式：$EVENT ${CRON:+（cron: $CRON）}${SOURCE:+（source: $SOURCE）}"
          echo "開始時間：$(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M:%S') 台灣時間"

      - uses: actions/checkout@v7

      - name: Read last check from state branch
        run: |
          if git fetch --depth=1 origin state 2>/dev/null \
            && git show FETCH_HEAD:last_check.json > "$RUNNER_TEMP/last_check.json" 2>/dev/null; then
            cat "$RUNNER_TEMP/last_check.json"
          else
            echo "沒有 last_check.json（第一次執行）"
            rm -f "$RUNNER_TEMP/last_check.json"
          fi

      # 只用標準函式庫，不需要安裝套件；任何錯誤都照常檢查（fail-open）
      - name: Decide
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          SOURCE: ${{ inputs.source }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          PYTHONPATH=src python3 -m fx_alert.gate \
            --last-check "$RUNNER_TEMP/last_check.json" --event "$EVENT" --source "$SOURCE" \
            || echo "run=true" >> "$GITHUB_OUTPUT"

  check:
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.run != 'false' }}
    runs-on: ubuntu-latest
    # 正式金鑰（secret key、Gmail 密碼、退訂密鑰、監控網址）放在 Environment「production-runtime」，
    # 只允許 main：有寫入權限的協作者推自己的 branch、改 workflow 也拿不到。不設審核者（排程每 30 分鐘跑）。
    environment: production-runtime
    timeout-minutes: 5
    outputs:
      config_ok: ${{ steps.validate.outputs.ok }}
      published: ${{ steps.commit.outputs.published }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install .

      # 設定檔不合法就停在這裡：不抓、不寄、不 commit
      - name: Validate config.yaml
        id: validate
        run: |
          python -m fx_alert validate-config
          echo "ok=true" >> "$GITHUB_OUTPUT"

      # 把 state 分支放到 data/（config.yaml 的 data_dir），程式直接在裡面讀寫
      - name: Check out state branch into data/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin state >/dev/null; then
            git fetch --depth=1 origin state:refs/remotes/origin/state
            git worktree add data origin/state
            git -C data switch -c state
          else
            echo "還沒有 state 分支：建立一個新的（只放資料）"
            git worktree add --detach data
            git -C data switch --orphan state
          fi
          ls -la data

      # 收件人來自 Supabase（每個人自己的 email），不再用 MAIL_TO。
      # log 是公開的：程式只印規則編號和收件人數，錯誤訊息裡的 email 也會遮蔽。
      - name: Check rates (multi-user)
        id: check
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          UNSUBSCRIBE_SECRET: ${{ secrets.UNSUBSCRIBE_SECRET }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          # 手機推播的 VAPID 私鑰（沒設定 = 不推播，Email 照常）
          WEB_PUSH_PRIVATE_KEY: ${{ secrets.WEB_PUSH_PRIVATE_KEY }}
          FORCE: ${{ inputs.force && '--force' || '' }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          # 就算有錯誤也先別讓 job 失敗：有些人可能已經寄出通知，走勢資料一定要先存起來
          set +e
          python -m fx_alert check --mode multi $FORCE $DRY_RUN
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      # state 分支是公開的：commit 前再確認一次沒有任何 email
      - name: Check data for emails
        run: |
          if grep -rIlE '@[A-Za-z0-9.-]+\.[A-Za-z]{2,}' data --exclude-dir=.git; then
            echo "::error::state 分支的資料疑似包含 email，停止 commit"
            exit 1
          fi
          echo "沒有發現 email"

      # 只有走勢、狀態、通知紀錄有變，或檢查從成功變失敗（或恢復）時才 commit 和部署；
      # 只有 last_check.json 的時間變了就不 commit（最後檢查時間已經寫到 Supabase）。見 publish.py
      - name: Commit data to state branch
        if: ${{ !inputs.dry_run }}
        working-directory: data
        id: commit
        run: |
          git add -A
          publish=$(PYTHONPATH="$GITHUB_WORKSPACE/src" python3 -m fx_alert.publish || echo true)
          if [ "$publish" != "true" ]; then
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "data: $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M') 台灣時間"
          git push origin state
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Fail if check reported errors
        if: steps.check.outputs.exit_code != '0'
        run: |
          echo "::error::fx_alert check 回報錯誤（結束碼 ${{ steps.check.outputs.exit_code }}），請看上面 Check rates 的輸出"
          exit 1

      # 監控（healthchecks.io）：檢查成功就 ping，失敗就 ping /fail；一段時間沒收到 ping 會寄信通知。
      # ping 網址等同密碼（知道就能假裝「一切正常」），只放在 Secrets，不寫進 repo、不印出來。
      # 沒設定 HEALTHCHECK_PING_URL 時略過；ping 失敗不影響這次檢查的結果。
      # 只有「真的檢查了」才算成功：時段外略過（例如延遲好幾小時才跑的排程）時 skipped=true，
      # workflow 雖然是綠燈，但不 ping，監控才會發現該跑的時段沒有檢查。
      - name: Note skipped run
        if: ${{ steps.check.outputs.skipped == 'true' }}
        run: echo "::notice::不在檢查時段內，略過檢查；不通知監控"

      - name: Ping monitor (success)
        if: ${{ success() && !inputs.dry_run && steps.check.outputs.skipped == 'false' }}
        env:
          HC_URL: ${{ secrets.HEALTHCHECK_PING_URL }}
        run: |
          if [ -z "$HC_URL" ]; then
            echo "::notice::沒有設定 HEALTHCHECK_PING_URL，略過監控 ping"
            exit 0
          fi
          curl -fsS -m 10 --retry 3 -o /dev/null "$HC_URL" \
            && echo "已通知監控：檢查成功" \
            || echo "::warning::監控 ping 失敗（不影響這次檢查）"

      - name: Ping monitor (failure)
        if: ${{ failure() && !inputs.dry_run }}
        env:
          HC_URL: ${{ secrets.HEALTHCHECK_PING_URL }}
        run: |
          if [ -z "$HC_URL" ]; then
            exit 0
          fi
          curl -fsS -m 10 --retry 3 -o /dev/null "$HC_URL/fail" \
            && echo "已通知監控：檢查失敗" \
            || echo "::warning::監控 ping 失敗"

  # state 分支有新的 commit 才更新頁面（publish.py 已經把「檢查失敗／恢復」也算進去，
  # 頁面才會顯示「有錯誤」）。設定檔不合法、dry-run、或只有最後檢查時間改變時不部署。
  deploy:
    needs: check
    if: >-
      ${{ !cancelled() && needs.check.outputs.config_ok == 'true' && !inputs.dry_run
      && needs.check.outputs.published == 'true' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
