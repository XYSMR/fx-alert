# 定時檢查匯率，到價就寄信（多人版）：
#   * 規則、狀態、通知紀錄在 Supabase（每個人自己的目標價，寄到自己的信箱）
#   * 公開的匯率走勢、最後檢查時間存在 state 分支，然後更新 GitHub Pages 上的頁面
# 退回單人版：Revert 切換的 PR（chore/cutover），見 docs/multi-user.md 的退回方案。
name: check-rates

on:
  schedule:
    # cron 用 UTC。台灣 = UTC+8，所以下面是台灣平日 09:07 ~ 16:07，每 30 分鐘一次。
    # 避開整點（GitHub 整點最塞），程式裡另有 09:00–16:30 的時段檢查。
    - cron: "7,37 1-7 * * 1-5"
    - cron: "7 8 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "略過檢查時段限制（--force）"
        type: boolean
        default: true
      dry_run:
        description: "不寄信、不寫入 Supabase，只印出來（--dry-run），也不 commit"
        type: boolean
        default: false

# 同一時間只能有一個在跑，避免兩次執行同時改 state 分支
concurrency:
  group: check-rates
  cancel-in-progress: false

permissions:
  contents: write # 需要 push 到 state 分支

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      config_ok: ${{ steps.validate.outputs.ok }}
    steps:
      # 排查用：記下這次是誰觸發的、預定的 cron、實際開始時間（GitHub 排程可能延遲或被丟掉）
      - name: Show trigger
        env:
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
        run: |
          echo "觸發方式：$EVENT ${CRON:+（cron: $CRON）}"
          echo "開始時間：$(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M:%S') 台灣時間"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install .

      # 設定檔不合法就停在這裡：不抓、不寄、不 commit
      - name: Validate config.yaml
        id: validate
        run: |
          python -m fx_alert validate-config
          echo "ok=true" >> "$GITHUB_OUTPUT"

      # 把 state 分支放到 data/（config.yaml 的 data_dir），程式直接在裡面讀寫
      - name: Check out state branch into data/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin state >/dev/null; then
            git fetch --depth=1 origin state:refs/remotes/origin/state
            git worktree add data origin/state
            git -C data switch -c state
          else
            echo "還沒有 state 分支：建立一個新的（只放資料）"
            git worktree add --detach data
            git -C data switch --orphan state
          fi
          ls -la data

      # 收件人來自 Supabase（每個人自己的 email），不再用 MAIL_TO。
      # log 是公開的：程式只印規則編號和收件人數，錯誤訊息裡的 email 也會遮蔽。
      - name: Check rates (multi-user)
        id: check
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          UNSUBSCRIBE_SECRET: ${{ secrets.UNSUBSCRIBE_SECRET }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          FORCE: ${{ inputs.force && '--force' || '' }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          # 就算有錯誤也先別讓 job 失敗：有些人可能已經寄出通知，走勢資料一定要先存起來
          set +e
          python -m fx_alert check --mode multi $FORCE $DRY_RUN
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      # state 分支是公開的：commit 前再確認一次沒有任何 email
      - name: Check data for emails
        run: |
          if grep -rIlE '@[A-Za-z0-9.-]+\.[A-Za-z]{2,}' data --exclude-dir=.git; then
            echo "::error::state 分支的資料疑似包含 email，停止 commit"
            exit 1
          fi
          echo "沒有發現 email"

      - name: Commit data to state branch
        if: ${{ !inputs.dry_run }}
        working-directory: data
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "沒有任何變更（例如不在檢查時段內），不 commit"
            exit 0
          fi
          git commit -m "data: $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M') 台灣時間"
          git push origin state

      - name: Fail if check reported errors
        if: steps.check.outputs.exit_code != '0'
        run: |
          echo "::error::fx_alert check 回報錯誤（結束碼 ${{ steps.check.outputs.exit_code }}），請看上面 Check rates 的輸出"
          exit 1

      # 監控（healthchecks.io）：檢查成功就 ping，失敗就 ping /fail；一段時間沒收到 ping 會寄信通知。
      # ping 網址等同密碼（知道就能假裝「一切正常」），只放在 Secrets，不寫進 repo、不印出來。
      # 沒設定 HEALTHCHECK_PING_URL 時略過；ping 失敗不影響這次檢查的結果。
      # 只有「真的檢查了」才算成功：時段外略過（例如延遲好幾小時才跑的排程）時 skipped=true，
      # workflow 雖然是綠燈，但不 ping，監控才會發現該跑的時段沒有檢查。
      - name: Note skipped run
        if: ${{ steps.check.outputs.skipped == 'true' }}
        run: echo "::notice::不在檢查時段內，略過檢查；不通知監控"

      - name: Ping monitor (success)
        if: ${{ success() && !inputs.dry_run && steps.check.outputs.skipped == 'false' }}
        env:
          HC_URL: ${{ secrets.HEALTHCHECK_PING_URL }}
        run: |
          if [ -z "$HC_URL" ]; then
            echo "::notice::沒有設定 HEALTHCHECK_PING_URL，略過監控 ping"
            exit 0
          fi
          curl -fsS -m 10 --retry 3 -o /dev/null "$HC_URL" \
            && echo "已通知監控：檢查成功" \
            || echo "::warning::監控 ping 失敗（不影響這次檢查）"

      - name: Ping monitor (failure)
        if: ${{ failure() && !inputs.dry_run }}
        env:
          HC_URL: ${{ secrets.HEALTHCHECK_PING_URL }}
        run: |
          if [ -z "$HC_URL" ]; then
            exit 0
          fi
          curl -fsS -m 10 --retry 3 -o /dev/null "$HC_URL/fail" \
            && echo "已通知監控：檢查失敗" \
            || echo "::warning::監控 ping 失敗"

  # 檢查完就更新頁面。就算這次抓匯率失敗也要部署，頁面才會顯示「有錯誤」；
  # 但設定檔不合法、或是 dry-run 時不部署。
  deploy:
    needs: check
    if: ${{ !cancelled() && needs.check.outputs.config_ok == 'true' && !inputs.dry_run }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
